<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 《晚风经过二楼走廊》应用图标：深绿纸面 + 傍晚亮着的二楼窗户 + 一页正文。
       全部是矢量图形，没有文字（小尺寸下文字只会变成噪点）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A4739"/>
      <stop offset="1" stop-color="#101C16"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FCE7BC"/>
      <stop offset="0.55" stop-color="#EFB076"/>
      <stop offset="1" stop-color="#C87C5B"/>
    </linearGradient>
    <clipPath id="pane">
      <rect x="56" y="44" width="144" height="118" rx="10"/>
    </clipPath>
  </defs>

  <!-- 圆角底板 -->
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="56" fill="none" stroke="#F3F5EB" stroke-opacity="0.12" stroke-width="2"/>

  <!-- 窗洞与暖光 -->
  <rect x="50" y="38" width="156" height="130" rx="14" fill="#0B1410" fill-opacity="0.55"/>
  <g clip-path="url(#pane)">
    <rect x="56" y="44" width="144" height="118" fill="url(#dusk)"/>
    <circle cx="168" cy="70" r="16" fill="#FFF4D8" fill-opacity="0.85"/>
    <path d="M56 132 C 96 116, 132 146, 200 124 L 200 162 L 56 162 Z" fill="#8E5A46" fill-opacity="0.35"/>
  </g>

  <!-- 窗框与横竖窗棂 -->
  <g fill="none" stroke="#F4F6EC" stroke-width="7" stroke-linecap="round">
    <rect x="56" y="44" width="144" height="118" rx="10"/>
    <path d="M128 44 V162"/>
    <path d="M56 103 H200"/>
  </g>

  <!-- 前景：一页正文，压在窗台右下角 -->
  <g transform="rotate(-9 150 186)">
    <rect x="96" y="140" width="104" height="78" rx="8" fill="#F6F7EE"/>
    <rect x="96" y="140" width="104" height="78" rx="8" fill="none" stroke="#2A4739" stroke-opacity="0.18" stroke-width="3"/>
    <g stroke="#2A4739" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round">
      <path d="M112 162 H184"/>
      <path d="M112 180 H172"/>
      <path d="M112 198 H150"/>
    </g>
  </g>
</svg>
